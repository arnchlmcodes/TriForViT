# FTT v2 — Default config (Stage A: decoder only, no LoRA)
# See docs/DECISIONS.md for rationale.

model:
  name: ftt_v2
  image_size: 512
  types:
    - copy_move
    - splicing
    - inpainting

backbone:
  name: dummy              # Use 'dinov3_vits16' for real training
  # hf_id: facebook/dinov3-vits16-pretrain-lvd1689m
  frozen: true

lora:
  enabled: false            # Stage A: no LoRA (decoder-only baseline)
  r: 64
  alpha: 128
  dropout: 0.0
  # target_modules: auto-detected from backbone

decoder:
  norm: gn                  # GroupNorm (safe for small batches)

det:
  enabled: false            # Enabled from Stage C
  use_mask_stats: true

type_head:
  enabled: false            # Enabled from Stage C
  pos_weight: null

cm:
  enabled: false            # Enabled in Stage D
  tap_layer: 4
  proj_dim: 128
  min_dist: 3
  topk: 8
  tau_init: 0.1

loss:
  lambda_edge: 20
  edge_band_px: 7
  lambda_det: 1.0
  lambda_type: 1.0

train:
  epochs: 20
  warmup_epochs: 5
  lr: 3.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  micro_batch: 8
  effective_batch: 64
  amp: fp16
  eval_every: 4
  seed: 42

data:
  manifest_dir: data/manifests
  balanced_sampler: true
  num_workers: 4

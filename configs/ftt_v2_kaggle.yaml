# ===========================================================================
# FTT v2 — Kaggle T4 GPU Training Configuration
# Hardware target: Single NVIDIA T4 (16 GB VRAM) or Dual T4 (2x 16 GB)
# ===========================================================================

model:
  name: ftt_v2
  image_size: 512
  types:
    - copy_move
    - splicing
    - inpainting

backbone:
  # Paper default: ViT-S/16 provides the strongest balance of speed & accuracy
  # To use ViT-B/16 instead: name: dinov3_vitb16, hf_id: facebook/dinov3-vitb16-pretrain-lvd1689m
  name: dinov3_vits16
  hf_id: facebook/dinov3-vits16-pretrain-lvd1689m
  frozen: true

lora:
  enabled: true
  r: 64
  alpha: 128
  dropout: 0.0
  targets: qkv_all_layers

decoder:
  norm: gn  # GroupNorm (stable across small micro-batches on T4)

det:
  enabled: true
  use_mask_stats: true
  zero_global_features: false

type_head:
  enabled: true
  pos_weight: null

cm:
  enabled: true
  tap_layer: 4
  proj_dim: 128
  min_dist: 3
  topk: 8
  tau_init: 0.1

loss:
  lambda_edge: 20
  edge_band_px: 7
  lambda_det: 1.0
  lambda_type: 1.0

train:
  epochs: 50
  warmup_epochs: 3
  lr: 3.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  micro_batch: 4        # 4 images @ 512x512 safely fits in 16 GB T4 VRAM
  effective_batch: 64   # Gradient accumulation: 64 // 4 = 16 micro-batches per step
  amp: fp16             # Automatic mixed precision on CUDA
  eval_every: 2
  seed: 42

data:
  # On Kaggle, generated manifests and checkpoints should be in writable /kaggle/working/
  manifest_dir: /kaggle/working/manifests
  image_root: /kaggle/input
  balanced_sampler: true
  num_workers: 2        # 2 workers avoids Linux shared memory (/dev/shm) bus errors
